<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="AI Augmented Software Engineering — a Zühlke course" preserveAspectRatio="xMidYMid meet">
  <title>AI Augmented Software Engineering</title>
  <desc>Banner for the AI Augmented Software Engineering training at Zühlke.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12152A"/>
      <stop offset="55%" stop-color="#1C1836"/>
      <stop offset="100%" stop-color="#2B1A32"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="78%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#F4A860" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#E07856" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolGlow" cx="10%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#6FB5A8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background layers -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#warmGlow)"/>
  <rect width="1600" height="500" fill="url(#coolGlow)"/>

  <!-- subtle background code marks -->
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" fill="#F5EFE2" fill-opacity="0.045">
    <text x="60" y="92" font-size="18">// refine → plan → implement</text>
    <text x="60" y="480" font-size="14">{ context }</text>
    <text x="900" y="475" font-size="14">&lt;prompt /&gt;</text>
    <text x="1050" y="60" font-size="16">tokens → embeddings → attention</text>
    <text x="1380" y="465" font-size="13">mcp://tools</text>
  </g>

  <!-- title block -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="200" font-size="74" font-weight="700" fill="#F5EFE2" letter-spacing="-1.8">AI Augmented</text>
    <text x="80" y="286" font-size="74" font-weight="700" fill="#F5EFE2" letter-spacing="-1.8">Software Engineering</text>

    <!-- accent rule -->
    <line x1="80" y1="322" x2="184" y2="322" stroke="#F4A860" stroke-width="3" stroke-linecap="round"/>

    <text x="80" y="368" font-size="22" font-weight="400" fill="#C9B9A3" letter-spacing="0.3">
      A Zühlke course on working deliberately with AI coding assistants.
    </text>

    <!-- bottom chip track -->
    <text x="80" y="450" font-size="13" font-weight="500" fill="#C9B9A3" fill-opacity="0.75" letter-spacing="3.6">
      LLMs · PROMPTING · CONTEXT · AGENTS · HARNESS · TOOLS
    </text>
  </g>

  <!-- right-side abstract node network -->
  <g>
    <!-- connecting curves -->
    <g stroke="#C9B9A3" stroke-opacity="0.28" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M1180,160 Q1250,190 1320,220"/>
      <path d="M1320,220 Q1280,270 1250,320"/>
      <path d="M1320,220 Q1370,250 1420,280"/>
      <path d="M1250,320 Q1340,300 1420,280"/>
      <path d="M1100,290 Q1180,300 1250,320"/>
      <path d="M1380,120 Q1400,200 1420,280"/>
      <path d="M1480,180 Q1450,230 1420,280"/>
      <path d="M1520,350 Q1470,320 1420,280"/>
      <path d="M1170,380 Q1210,350 1250,320"/>
      <path d="M1290,90 Q1330,100 1380,120"/>
      <path d="M1360,400 Q1440,380 1520,350"/>
    </g>

    <!-- glowing hub -->
    <circle cx="1420" cy="280" r="30" fill="#F4A860" fill-opacity="0.28" filter="url(#soft)"/>
    <circle cx="1420" cy="280" r="14" fill="#F4A860"/>
    <circle cx="1420" cy="280" r="4" fill="#12152A"/>

    <!-- surrounding nodes -->
    <circle cx="1180" cy="160" r="10" fill="#E07856"/>
    <circle cx="1320" cy="220" r="8" fill="#E07856"/>
    <circle cx="1250" cy="320" r="10" fill="#6FB5A8"/>
    <circle cx="1100" cy="290" r="7" fill="#E07856"/>
    <circle cx="1380" cy="120" r="9" fill="#6FB5A8"/>
    <circle cx="1480" cy="180" r="6" fill="#F4A860"/>
    <circle cx="1520" cy="350" r="8" fill="#E07856"/>
    <circle cx="1170" cy="380" r="9" fill="#6FB5A8"/>
    <circle cx="1290" cy="90" r="6" fill="#F4A860"/>
    <circle cx="1360" cy="400" r="7" fill="#E07856"/>
  </g>

  <!-- thin bottom border glow -->
  <rect x="0" y="498" width="1600" height="2" fill="#F4A860" fill-opacity="0.35"/>
</svg>
